<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Embed Example</title>
  <style>
    .embed-container {
      width: 100%;
      max-width: 800px;
      height: 500px;
      margin: 0 auto;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="embed-container">
    <iframe 
      src="https://demoapp.sbc.vocom.global/" 
      title="Embedded Website"
      loading="lazy"
      sandbox="allow-scripts allow-same-origin">
    </iframe>
  </div>

</body>
</html>
